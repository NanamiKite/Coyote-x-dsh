# 郊狼xDSH（Coyote x DSH） · DSH bundle patch
#
# 本文件由 package.json 的 dsh.bundle.patch 声明；
# `dsh plugin --profile web add <本包>` 安装后自动叠入配置层。
#
# name 用**裸包名**（不是相对路径）：两个机制都依赖它——
#   1) host 侧经 Node 解析（profile 的 node_modules）找到本包，
#      exports["."] 指向 src/plugin/index.mjs；
#   2) dsh-client-modules 只把**说明符恰为包名**的 Loader 行
#      挂上浏览器半侧（package.json 的 dsh.client），相对路径不行。
# 两个条件现在都由 `coyote-x-dsh` 一个说明符满足。
#
# 安全上限：下面 config: 的每个字段都受 src/plugin/index.mjs 的
# Config schema 硬校验（越界 = 启动报错），AI 工具层无法修改；
# 运行时还有 rules.normalizeConfig 与 CoyoteSafety 两层独立钳制。
# 想调整本机上限：DSH 插件管理器 → 本包 → tentacle 行的「配置」页
# （浏览器半侧 lib/client.js 渲染的六字段表单，保存即时生效）；
# 也可以用 profile 的 cordis.patch.yml 覆盖（同 id 行后层整块替换）。
- insert:
    - id: tentacle
      name: coyote-x-dsh
      config:
        # ble = 真机（需设备所在电脑运行）；无硬件调试改 mock
        backend: ble
        # 输出通道：A / B / AB（双通道同发）
        channel: A
        # 默认强度挡位（0–200；协议 S = 挡位 × 7）
        intensity: 20
        # 强度上限：招式计划只能被钳到更低，本机天花板就在这里
        maxIntensity: 40
        # 默认单次时长 ms
        durationMs: 1500
        # 时长上限 ms（硬顶 30000）
        maxDurationMs: 5000
        # 两次反馈之间的冷却秒数
        cooldown: 10
